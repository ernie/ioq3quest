name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;27.3.13750724" "cmake;3.22.1" "build-tools;32.0.0"

      - name: Download latest Trinity
        run: |
          curl -fL -o android/app/src/main/assets/pak8t.pk3 https://github.com/ernie/trinity/releases/latest/download/pak8t.pk3
          curl -fL -o android/app/src/main/assets/pak3t.pk3 https://github.com/ernie/trinity/releases/latest/download/pak3t.pk3
          curl -fL -o android/app/src/main/assets/zzz-trinity-announcer.pk3 https://github.com/ernie/trinity/releases/latest/download/zzz-trinity-announcer.pk3

      - name: CMake configure
        run: |
          cmake -Wno-deprecated -B build -S android/app/src/main/cpp \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/27.3.13750724/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFULL_BUILD=ON \
            -G Ninja

      - name: CMake build
        run: cmake --build build -j$(nproc)

      - name: Gradle build
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/32.0.0/apksigner
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(git show -s --pretty=format:%h)
          fi
          OUTDIR=android/app/build/outputs/apk/release
          SIGNED=$OUTDIR/trinity-quest-${VERSION}.apk
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$SIGNED" \
            --v2-signing-enabled true \
            "$UNSIGNED"
          rm /tmp/keystore.jks
          rm "$UNSIGNED"
          # Transition bridge: also publish under the pre-rename name so clients
          # built before the trinity-quest rename (UPDATE_ASSET_PREFIX "ioq3quest")
          # can still find an asset and auto-update onto the new prefix.
          # The v2 signature covers contents, not filename, so the copy stays valid.
          # TODO: remove this legacy copy once old "ioq3quest" clients have aged out.
          cp "$SIGNED" "$OUTDIR/ioq3quest-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: trinity-quest-apk
          path: |
            android/app/build/outputs/apk/release/trinity-quest-*.apk
            android/app/build/outputs/apk/release/ioq3quest-*.apk
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: trinity-quest-apk
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/trinity-quest-*.apk
            dist/ioq3quest-*.apk
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
